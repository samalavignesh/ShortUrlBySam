spring.application.name=url-shortener

# =====================================================
# DATABASE CONFIGURATION — H2 In-Memory (Development)
# =====================================================
# Using H2 in-memory database for development.
# Data is lost on restart — perfect for development/testing.
#
# In PRODUCTION, replace with PostgreSQL:
#   spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
#   spring.datasource.username=your_username
#   spring.datasource.password=your_password
#   spring.datasource.driver-class-name=org.postgresql.Driver
#   spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console — access at http://localhost:8080/h2-console
# Useful for inspecting the database during development.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================
# ddl-auto=create-drop → Hibernate creates tables on startup
#                         and drops them on shutdown.
# In PRODUCTION, use 'validate' or 'none' with Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=create-drop

# Show SQL queries in the console (helpful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# JWT CONFIGURATION
# =====================================================
# Secret key for signing JWT tokens (Base64-encoded, min 256-bit for HS256).
#
# DEV PROFILE  : Uses the insecure fallback below — NEVER ship this to prod.
# PROD PROFILE : Loaded from AWS SSM at /config/urlshortener/jwt.secret
#                (see application-postgres.properties)
jwt.secret=${JWT_SECRET:ZGV2LW9ubHktaW5zZWN1cmUta2V5LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZy14eHh4}

# Token expiration time in milliseconds
# 86400000 ms = 24 hours
jwt.expiration=${JWT_EXPIRATION:86400000}

# =====================================================
# APPLICATION CONFIGURATION
# =====================================================
# Base URL used to construct full short URLs
# In production: https://short.yourdomain.com
app.base-url=${APP_BASE_URL:http://localhost:8080}

# =====================================================
# REDIS CONFIGURATION (Caching Layer)
# =====================================================
# Redis is used to cache URL lookups for blazing-fast redirects.
# Install Redis: winget install Redis.Redis
# Default: localhost:6379 (no password)
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=your-redis-password  ← uncomment in production

# =====================================================
# GMAIL SMTP CONFIGURATION
# =====================================================
# DEV PROFILE  : Set MAIL_PASSWORD as a local env var, or leave blank
#                if you are not testing email flows locally.
# PROD PROFILE : Loaded from AWS SSM at /config/urlshortener/mail.password
#                (see application-postgres.properties)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=urlshortenbysam@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =====================================================
# LOGGING CONFIGURATION
# =====================================================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n

# =====================================================
# SECURITY HEADER CONFIGURATION
# =====================================================
server.server-header=
