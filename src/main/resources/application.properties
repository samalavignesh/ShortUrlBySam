spring.application.name=url-shortener

# =====================================================
# DATABASE CONFIGURATION — H2 In-Memory (Development)
# =====================================================
# Using H2 in-memory database for development.
# Data is lost on restart — perfect for development/testing.
#
# In PRODUCTION, replace with PostgreSQL:
#   spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
#   spring.datasource.username=your_username
#   spring.datasource.password=your_password
#   spring.datasource.driver-class-name=org.postgresql.Driver
#   spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console — access at http://localhost:8080/h2-console
# Useful for inspecting the database during development.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================
# ddl-auto=create-drop → Hibernate creates tables on startup
#                         and drops them on shutdown.
# In PRODUCTION, use 'validate' or 'none' with Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=create-drop

# Show SQL queries in the console (helpful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# JWT CONFIGURATION
# =====================================================
# Secret key for signing JWT tokens (Base64-encoded, min 256-bit for HS256).
# IMPORTANT: In production, override this via environment variable:
#   export JWT_SECRET=your-production-secret
# NEVER commit a real production secret to version control!
jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgc2VjdXJlIGtleSBmb3IgZGV2ZWxvcG1lbnQgb25seSEhIQ==}

# Token expiration time in milliseconds
# 86400000 ms = 24 hours
jwt.expiration=${JWT_EXPIRATION:86400000}

# =====================================================
# APPLICATION CONFIGURATION
# =====================================================
# Base URL used to construct full short URLs
# In production: https://short.yourdomain.com
app.base-url=${APP_BASE_URL:http://localhost:8080}

# =====================================================
# REDIS CONFIGURATION (Caching Layer)
# =====================================================
# Redis is used to cache URL lookups for blazing-fast redirects.
# Install Redis: winget install Redis.Redis
# Default: localhost:6379 (no password)
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=your-redis-password  ← uncomment in production

