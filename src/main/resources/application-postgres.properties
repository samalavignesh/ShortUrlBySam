# =====================================================
# SPRING PROFILE: postgres
# =====================================================
#
# This file activates when you run with:
#   -Dspring-boot.run.profiles=postgres  (Maven)
#   --spring.profiles.active=postgres    (JAR)
#   Active Profiles: postgres            (IDE)
#
# It OVERRIDES settings in application.properties,
# switching from H2 in-memory to real PostgreSQL.
#
# PREREQUISITE:
#   docker compose up -d   <- must be running first!
#
# SECRETS: All credentials are loaded at startup from
# AWS SSM Parameter Store under /config/urlshortener/
# The EC2 instance profile provides credentials —
# no AWS keys are stored anywhere in the application.
# =====================================================


# =====================================================
# AWS SSM PARAMETER STORE — Secret Injection
# =====================================================
#
# Spring Cloud AWS reads ALL parameters under the path
# prefix below and makes them available as Spring
# properties using the last path segment as the key.
#
# SSM Path                              -> Spring Property
# /config/urlshortener/jwt.secret       -> jwt.secret
# /config/urlshortener/mail.password    -> mail.password
# /config/urlshortener/db.password      -> db.password
# /config/urlshortener/app.base-url     -> app.base-url
#
# The explicit mappings below bind those to the
# property names Spring Boot / the app actually uses.
#
# FAIL-FAST: No 'optional:' prefix — if SSM is
# unreachable at startup the application will refuse
# to start rather than silently use empty values.
# =====================================================
spring.config.import=aws-parameterstore:/config/urlshortener/

# Auto-detect AWS region from EC2 instance metadata.
# No static region needed — the instance metadata service
# (IMDS) provides it automatically on EC2.
spring.cloud.aws.region.use-default-aws-region-chain=true

# =====================================================
# SECRET PROPERTY MAPPINGS
# =====================================================
# These lines map the SSM-loaded property names to the
# property keys that Spring Boot / the application expect.

# JWT signing secret — same name in SSM, resolves directly
jwt.secret=${jwt.secret}

# App base URL — same name in SSM, resolves directly
app.base-url=${app.base-url}

# SMTP password — SSM key is 'mail.password',
# Spring Boot expects 'spring.mail.password'
spring.mail.password=${mail.password}

# DB password — SSM key is 'db.password',
# Spring Boot expects 'spring.datasource.password'
spring.datasource.password=${db.password}



# =====================================================
# DATABASE -- PostgreSQL (from Docker Compose)
# =====================================================
#
# Credentials match docker-compose.yml:
#   POSTGRES_DB:       urlshortener
#   POSTGRES_USER:     urluser
#   POSTGRES_PASSWORD: urlpass

spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=urluser
# Password is loaded from SSM — see mapping above

# =====================================================
# JPA / HIBERNATE -- PostgreSQL Dialect
# =====================================================
#
# ddl-auto=update:
#   Hibernate compares existing schema with entities and
#   applies only the missing changes (ADD COLUMN, CREATE TABLE).
#   Safe for development -- existing data is preserved
#   NOT for production -- use Flyway/Liquibase migrations instead

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# RESTRICT SWAGGER UI (Fix 7)
# =====================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Disable open-in-view (correct for REST APIs, suppresses the startup warning)
spring.jpa.open-in-view=false

# =====================================================
# DISABLE H2 CONSOLE (not needed with PostgreSQL)
# =====================================================
spring.h2.console.enabled=false

# =====================================================
# REDIS CONFIGURATION
# =====================================================
# Redis Docker container runs on localhost:6379 (no password)
spring.data.redis.host=localhost
spring.data.redis.port=6380

# Redis Connection Pooling for high concurrency
spring.data.redis.lettuce.pool.max-active=100
spring.data.redis.lettuce.pool.max-idle=50
spring.data.redis.lettuce.pool.min-idle=10

# Tomcat Thread Tuning for high RPS
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
