# 1. HTTP Server - Redirects all plain HTTP requests to HTTPS
server {
    listen 80;
    server_name shorturlbysam.duckdns.org;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server - Handles SSL and serves your application
server {
    listen 443 ssl;
    server_name shorturlbysam.duckdns.org;

    # SSL Certificates generated by Certbot
    ssl_certificate /etc/letsencrypt/live/shorturlbysam.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shorturlbysam.duckdns.org/privkey.pem;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static assets directory generated by Vite
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Known React frontend routes
    location = / { try_files /index.html =404; }
    location = /login { try_files /index.html =404; }
    location = /register { try_files /index.html =404; }
    location = /dashboard { try_files /index.html =404; }

    # Any other static files in the root (favicon.ico, robots.txt, etc)
    location ~* \.(ico|svg|png|jpg|jpeg|css|js|json|txt)$ {
        try_files $uri =404;
    }

    # Everything else (short URLs like /abc1234) gets proxied to backend
    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
