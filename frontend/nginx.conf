server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets directory generated by Vite
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Known React frontend routes
    location = / { try_files /index.html =404; }
    location = /login { try_files /index.html =404; }
    location = /register { try_files /index.html =404; }
    location = /dashboard { try_files /index.html =404; }

    # Any other static files in the root (favicon.ico, robots.txt, etc)
    location ~* \.(ico|svg|png|jpg|jpeg|css|js|json|txt)$ {
        try_files $uri =404;
    }

    # Everything else (which should be the short URLs like /abc1234) 
    # gets proxied to the backend for redirection
    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
